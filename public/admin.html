<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#07180f">
  <title>AuraPops Admin</title>
  <link rel="stylesheet" href="/aurapops/admin.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20261002">
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png?v=20261002">
  <link rel="apple-touch-icon" sizes="180x180" href="/brand/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
  <section class="login" id="loginView">
    <div class="login-card">
      <img class="mark" src="/brand/aurapops-mark.png" alt="AuraPops" width="64" height="34">
      <h1>AuraPops Admin</h1>
      <p>Enter the private AuraPops dashboard password to manage requests, payments and activations.</p>
      <form id="loginForm">
        <label>Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Sign in</button>
      </form>
      <div id="loginNotice"></div>
    </div>
  </section>

  <main class="dashboard" id="dashboardView" hidden>
    <header class="dash-head">
      <div><span class="eyebrow">AURAPOPS CONTROL</span><h1>Activation dashboard</h1><small id="currentUser"></small></div>
      <div class="head-actions"><a href="https://auradigitalworks.com/admin/" target="_blank" rel="noopener noreferrer">Main dashboard ↗</a><a href="/builder.html" target="_blank">Open builder ↗</a><button id="logout" type="button">Sign out</button></div>
    </header>
    <div id="metrics" class="metrics"></div>
    <section class="panel">
      <div class="panel-head"><div><h2>AuraPops</h2><p>Public QR pages only open after payment is marked paid and the profile is activated.</p></div><button id="refresh">Refresh</button></div>
      <div id="content"></div>
    </section>
  </main>
  <script src="/aurapops/admin.js"></script>
</body>
</html>
